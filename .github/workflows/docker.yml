name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # woechentlich neu bauen, damit das Ubuntu-Basisimage aktuell bleibt
    - cron: "23 3 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # (immer main: ein zeitgesteuerter oder von Hand gestarteter Lauf nimmt sonst den Standard-Branch bzw. den
      # gewaehlten Branch und ueberschreibt :latest mit einem alten Stand; am 23.11.2026 so geschehen, a02b155)
      - uses: actions/checkout@v7
        with:
          ref: main
      - id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ steps.rev.outputs.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ps5-longshot-builder:latest
            ghcr.io/${{ github.repository_owner }}/ps5-longshot-builder:${{ steps.rev.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
